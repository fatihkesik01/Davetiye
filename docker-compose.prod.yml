services:
  postgres:
    image: postgres:16-alpine
    container_name: davetiye-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - davetiye_postgres_data:/var/lib/postgresql/data
    networks:
      - davetiye-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    image: davetiye-migrator:latest
    container_name: davetiye-migrator-prod
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:?set in .env};Username=${POSTGRES_USER:?set in .env};Password=${POSTGRES_PASSWORD:?set in .env}
      DataProtection__KeyRingDirectory: /tmp/davetiye-dp-keys
      PublicWeb__BaseUrl: ${PUBLIC_WEB_BASE_URL:?set in .env}
      Cors__AllowedOrigins__0: ${PUBLIC_WEB_ORIGIN:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - davetiye-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: davetiye-api:latest
    container_name: davetiye-api-prod
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:?set in .env};Username=${POSTGRES_USER:?set in .env};Password=${POSTGRES_PASSWORD:?set in .env}
      DataProtection__KeyRingDirectory: /var/davetiye/dp-keys
      PublicWeb__BaseUrl: ${PUBLIC_WEB_BASE_URL:?set in .env}
      Cors__AllowedOrigins__0: ${PUBLIC_WEB_ORIGIN:?set in .env}
      Resend__ApiKey: ${RESEND_API_KEY:-}
      Resend__FromAddress: ${RESEND_FROM_ADDRESS:-}
      Resend__FromName: ${RESEND_FROM_NAME:-Kutlio}
      TrustedProxies__Networks__0: 172.16.0.0/12
      GoogleAuth__Enabled: "false"
      PublicWeb__AppShellUrl: http://web:8080/
      RsvpCapabilities__HmacKeyBase64: ${RSVP_CAPABILITY_HMAC_KEY_BASE64:?set in .env}
      RsvpCapabilities__HmacKeyVersion: ${RSVP_CAPABILITY_HMAC_KEY_VERSION:-1}
      GiftCapabilities__HmacKeyBase64: ${GIFT_CAPABILITY_HMAC_KEY_BASE64:?set in .env}
      GiftCapabilities__HmacKeyVersion: ${GIFT_CAPABILITY_HMAC_KEY_VERSION:-1}
      MemoryUploadCapabilities__HmacKeyBase64: ${MEMORY_UPLOAD_CAPABILITY_HMAC_KEY_BASE64:?set in .env}
      MemoryUploadCapabilities__HmacKeyVersion: ${MEMORY_UPLOAD_CAPABILITY_HMAC_KEY_VERSION:-1}
      CloudflareMedia__Enabled: ${CLOUDFLARE_MEDIA_ENABLED:-false}
      CloudflareMedia__WorkerBaseUrl: ${CLOUDFLARE_MEDIA_WORKER_BASE_URL:-}
      CloudflareMedia__ImageCapabilitySigningKeyBase64Url: ${CLOUDFLARE_MEDIA_IMAGE_CAPABILITY_SIGNING_KEY_BASE64URL:-}
      CloudflareMedia__WorkerBrokerAuthorizationKey: ${CLOUDFLARE_MEDIA_WORKER_BROKER_AUTHORIZATION_KEY:-}
      CloudflareMedia__StreamWebhookSecret: ${CLOUDFLARE_MEDIA_STREAM_WEBHOOK_SECRET:-}
      CloudflareMedia__WebhookMaxAgeSeconds: ${CLOUDFLARE_MEDIA_WEBHOOK_MAX_AGE_SECONDS:-300}
      CloudflareMedia__MaximumVideoPlaybackSessionSeconds: ${CLOUDFLARE_MEDIA_MAXIMUM_VIDEO_PLAYBACK_SESSION_SECONDS:-1800}
      CloudflareMedia__StreamCustomerHostname: ${CLOUDFLARE_MEDIA_STREAM_CUSTOMER_HOSTNAME:-}
    volumes:
      - davetiye_dataprotection_keys:/var/davetiye/dp-keys
    read_only: true
    tmpfs:
      - /tmp
    # The entrypoint starts as root only to claim ownership of the named key
    # volume, then drops to the image's app user before launching .NET.
    user: "0"
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5052:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - davetiye-internal
      - davetiye-edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        CSP_MEDIA_WORKER_ORIGIN: ${CSP_MEDIA_WORKER_ORIGIN:-}
        CSP_STREAM_CUSTOMER_ORIGIN: ${CSP_STREAM_CUSTOMER_ORIGIN:-}
    image: davetiye-web:latest
    container_name: davetiye-web-prod
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - davetiye-edge
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  davetiye_postgres_data:
    name: davetiye_postgres_data
  davetiye_dataprotection_keys:
    name: davetiye_dataprotection_keys

networks:
  davetiye-internal:
    name: davetiye_internal
    internal: true
  davetiye-edge:
    name: davetiye_edge
